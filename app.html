<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研擎 NebulaLab · 科研经营工作台</title>
<style>
:root{
  --navy:#0A1E4E; --navy2:#123068; --ink:#17213B; --mut:#5A6784; --line:#E3E8F2;
  --bg:#F4F7FC; --card:#FFFFFF; --blue:#1B4DFF; --soft:#EEF3FE;
  --green:#047857; --gold:#B45309; --red:#B91C1C; --cyan:#0891B2;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13.5px;background:#fff;border:1px solid #D6DEED;color:var(--ink);border-radius:8px;padding:8px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(27,77,255,.12)}
a{color:var(--blue)}
::selection{background:rgba(27,77,255,.25)}

/* ============ 登录页 ============ */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1.1fr}
@media(max-width:900px){.login{grid-template-columns:1fr}}
.lg-brand{background:linear-gradient(155deg,#08163B,#123068 60%,#0E3AA0);color:#fff;padding:64px 56px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.lg-brand::before{content:"";position:absolute;right:-160px;bottom:-160px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(59,123,250,.3),transparent 65%)}
.lg-brand .logo{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800}
.lg-brand .logo .m{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:19px;font-weight:900}
.lg-brand h1{font-size:clamp(28px,3.4vw,40px);font-weight:900;line-height:1.35;margin:auto 0}
.lg-brand h1 em{font-style:normal;color:#8FB0FF}
.lg-brand p{color:#B9C7E8;font-size:15px;max-width:420px}
.lg-brand .ft{font-size:12.5px;color:#7C8DBB;margin-top:30px}
.lg-panel{display:flex;flex-direction:column;justify-content:center;padding:56px 64px}
@media(max-width:600px){.lg-panel{padding:36px 22px}}
.lg-panel h2{font-size:24px;font-weight:800;color:var(--navy)}
.lg-panel .sub{color:var(--mut);margin:6px 0 30px;font-size:14px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.roles{grid-template-columns:1fr}}
.role{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:22px 20px;text-align:left;transition:.2s;position:relative}
.role:hover{border-color:var(--blue);box-shadow:0 12px 30px rgba(10,30,78,.10);transform:translateY(-3px)}
.role .av{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:21px;margin-bottom:12px}
.role b{display:block;font-size:16.5px;color:var(--navy)}
.role .en{font-size:10.5px;letter-spacing:.18em;color:#9AA6C2;font-weight:700}
.role span{display:block;font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.55}
.role .go{position:absolute;top:18px;right:18px;color:#9AA6C2;font-weight:900}
.lg-tip{margin-top:26px;font-size:12.5px;color:#8B95AD;background:var(--soft);border-radius:10px;padding:12px 16px}

/* ============ 应用框架 ============ */
.app{display:flex;min-height:100vh}
.side{width:225px;flex:none;background:var(--navy);color:#C4D2F5;display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh}
.side .logo{display:flex;align-items:center;gap:10px;padding:6px 10px 20px;color:#fff;font-weight:800;font-size:16px}
.side .logo .m{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#3E7BFA,#22D3EE);display:grid;place-items:center;font-weight:900;color:#fff;font-size:15px}
.nav-i{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:9px;color:#A9B7DC;font-size:13.8px;font-weight:500;width:100%;text-align:left;transition:.15s}
.nav-i:hover{color:#fff;background:rgba(255,255,255,.07)}
.nav-i.on{color:#fff;background:linear-gradient(90deg,rgba(62,123,250,.35),rgba(62,123,250,.12))}
.nav-i .ic{width:20px;text-align:center;flex:none}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding-top:14px}
.who{display:flex;gap:10px;align-items:center;padding:0 10px 12px}
.who .av{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.who b{display:block;color:#fff;font-size:13.5px}
.who span{font-size:11px;color:#8FA0C9}
.side-foot button{width:100%;padding:8px;border-radius:8px;color:#8FA0C9;font-size:12.5px}
.side-foot button:hover{background:rgba(255,255,255,.08);color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;gap:14px;position:sticky;top:0;z-index:20}
.top h1{font-size:17px;font-weight:800;color:var(--navy)}
.top .crumb{font-size:12px;color:var(--mut)}
.rb{margin-left:auto;display:flex;align-items:center;gap:9px}
.rb .pill{font-size:11.5px;font-weight:800;padding:4px 12px;border-radius:999px}
.rbg-ug{background:#ECFDF5;color:#047857}.rbg-grad{background:#EEF3FE;color:#1B4DFF}
.rbg-pi{background:#FFF7E6;color:#B45309}.rbg-admin{background:#F5F3FF;color:#6D28D9}
.view{padding:24px;max-width:1180px;width:100%;margin:0 auto}
.hide{display:none!important}
@media(max-width:760px){.side{width:62px}.side .logo span,.nav-i span.t,.who,.side-foot .t2{display:none}.nav-i{justify-content:center}.view{padding:16px}}

/* 组件 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:8px;font-size:13.5px;font-weight:700;transition:.15s;border:1px solid transparent}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:#0F3EE0}
.btn-n{background:var(--navy);color:#fff}
.btn-n:hover{background:var(--navy2)}
.btn-o{border-color:#C9D4EC;color:var(--navy);background:#fff}
.btn-o:hover{border-color:var(--blue);color:var(--blue)}
.btn-s{padding:5px 12px;font-size:12px;border-radius:7px}
.btn-g{border-color:#D6DEED;color:var(--mut);background:#fff}
h3.st{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px}
h3.st .n{font-size:11px;color:#9AA6C2;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;color:var(--mut);text-align:left;font-weight:700;padding:9px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #EEF1F8;vertical-align:middle}
tr:hover td{background:#FAFBFE}
.tag{display:inline-block;font-size:11px;padding:2.5px 10px;border-radius:999px;background:var(--soft);color:#2749A8;font-weight:700}
.tag.g{background:#ECFDF5;color:#047857}.tag.y{background:#FFF7E6;color:#B45309}
.tag.r{background:#FEF2F2;color:#B91C1C}.tag.v{background:#F5F3FF;color:#6D28D9}
.tag.c{background:#ECFEFF;color:#0E7490}.tag.m{background:#F3F4F6;color:#4B5563}
.bar{height:8px;border-radius:99px;background:#EDF0F7;overflow:hidden;min-width:56px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#1B4DFF,#3E7BFA)}
.empty{padding:36px;text-align:center;color:#9AA6C2;font-size:13px;background:#FBFCFE;border:1px dashed #DCE3F0;border-radius:12px}
.mut{color:var(--mut)}.sm{font-size:12.5px}.xs{font-size:11.5px}
.kpi .v{font-size:27px;font-weight:900;color:var(--navy)}
.kpi .l{font-size:12.5px;color:var(--mut)}
.kpi .d{font-size:11.5px;font-weight:700}
.up{color:var(--green)}.dn{color:var(--red)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;border:1px solid;font-size:12.8px;margin-bottom:9px;background:#fff}
.alert.warn{border-color:#F3E3C3;background:#FFFBF2;color:#8a6116}
.alert.dan{border-color:#F3CFCF;background:#FFF7F7;color:#991B1B}
.alert.info{border-color:#CFE0F7;background:#F7FAFF;color:#1e3a8a}
.alert b{flex:none}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600}
.mask{position:fixed;inset:0;background:rgba(8,22,59,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
.mask.open{display:flex}
.modal{width:min(560px,100%);background:#fff;border-radius:16px;padding:26px;max-height:86vh;overflow-y:auto;box-shadow:0 30px 80px rgba(8,22,59,.3)}
.modal h3{font-size:17px;color:var(--navy);margin-bottom:16px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--navy);color:#fff;font-size:13px;padding:11px 22px;border-radius:999px;transition:.3s;z-index:99;opacity:0;box-shadow:0 12px 30px rgba(8,22,59,.35)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
/* chat */
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 132px);min-height:460px}
.chats{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px}
.msg{max-width:78%;padding:11px 15px;border-radius:14px;font-size:13.5px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--blue);color:#fff;border-radius:14px 14px 4px 14px}
.msg.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px}
.msg.a b{color:var(--navy)}
.chipq{font-size:12px;padding:6px 14px;border-radius:999px;border:1px solid #CFE0F7;color:#1e3a8a;background:#fff;font-weight:600}
.chipq:hover{background:var(--soft)}
/* roadmap */
.rw{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:#fff}
.rw .ck{width:22px;height:22px;border-radius:7px;border:2px solid #CBD5E8;flex:none;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900;margin-top:2px}
.rw.done .ck{background:var(--green);border-color:var(--green)}
.rw b{font-size:14px;color:var(--navy)}
.rw span{display:block;font-size:12.5px;color:var(--mut)}
.rw .wk{margin-left:auto;font-size:11px;color:#9AA6C2;font-weight:800;flex:none}
.toolc{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}
.toolc b{font-size:14px;color:var(--navy)}
.toolc .q{font-size:12px;color:var(--blue);font-weight:700;margin:3px 0 5px}
.toolc span{font-size:12.3px;color:var(--mut)}
/* console */
.console{background:#0B1830;border-radius:11px;padding:15px;font-family:Consolas,monospace;font-size:12.3px;color:#AFC6F0;min-height:170px;max-height:280px;overflow-y:auto;line-height:1.8}
.console .ok{color:#4ADE80}.console .cy{color:#67E8F9}.console .wn{color:#FDE68A}
.step-li{list-style:none}
.step-li li{display:flex;gap:9px;align-items:center;padding:6px 0;font-size:13px;color:var(--mut)}
.step-li li.done{color:var(--ink)}
.step-li li.done::before{content:"✓";color:var(--green);font-weight:900}
.step-li li.doing::before{content:"◐";color:var(--blue)}
.step-li li::before{content:"○";color:#B7C2D9}
/* 日历 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:11px;color:#9AA6C2;padding:5px 0;font-weight:700}
.day{min-height:72px;border:1px solid var(--line);border-radius:9px;padding:6px;font-size:11px;cursor:pointer;background:#fff}
.day:hover{border-color:var(--blue)}
.day.dim{opacity:.3;background:#F7F9FC}
.day .dn{font-size:11.5px;color:var(--mut);font-weight:800}
.ev{display:block;border-radius:5px;padding:1.5px 6px;margin-top:3px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev.a{background:#E4EDFF;color:#1B4DFF}.ev.b{background:#E7F8F1;color:#047857}
.ev.c{background:#FEF2F2;color:#B91C1C}.ev.d{background:#FFF4E0;color:#B45309}
.ev.e{background:#F5F3FF;color:#6D28D9}.ev.f{background:#F3F4F6;color:#374151}
/* 成员 */
.member{border:1px solid var(--line);border-radius:13px;padding:15px;background:#fff}
.member .top{display:flex;gap:11px;align-items:center;margin-bottom:9px}
.member .av{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#123068,#3E7BFA);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.member b{font-size:14px;color:var(--navy)}
.loadhi{color:var(--red);font-weight:800}.loadmd{color:var(--gold);font-weight:800}.loadlo{color:var(--green);font-weight:800}
/* 图表 */
.chart{width:100%;overflow:hidden}
</style>
</head>

<div id="login" class="login">
  <div class="lg-brand">

        <div class="av" style="background:#EEF3FE">🔬</div><span class="go">→</span>

      </button>
      <button class="role" onclick="enter('pi')">
        <div class="av" style="background:#FFF7E6">👨‍🏫</div><span class="go">→</span>

  </div>
</div>

<!-- ================= 应用 ================= -->
<div id="app" class="app hide">
  <aside class="side">
    <div class="logo"><div class="m">N</div><span>研擎 NebulaLab</span></div>
    <div id="navbox"></div>
    <div class="side-foot">
      <div class="who"><div class="av" id="wAv">研</div><div><b id="wName">—</b><span id="wRole">—</span></div></div>

    <div id="views" class="view"></div>
  </main>
</div>

<script>

================================================================ */
const ROLE_INFO={

const NAVS={

  grad:[['dash','工作台','🧭'],['lib','文献库','📚'],['lab','复现工场','🧪'],['publish','投稿中心','🚀'],['mytask','我的任务','✅'],['mycal','我的日程','📅'],['reimb','我的报销','🧾'],['profile','成长档案','📈'],['claw','研擎 Claw','🤖']],
  pi:[['dash','工作台','🧭'],['lib','文献库','📚'],['lab','复现工场','🧪'],['publish','组内投稿','🚀'],['mail','套磁收件箱','📬'],['team','课题组调度','👥'],['fund','经费管家','💰'],['cal','日程中心','📅'],['members','成员档案','🗂'],['claw','研擎 Claw','🤖']],
  admin:[['idash','机构驾驶舱','🏛'],['projects','项目监管','📑'],['fundsup','经费监管','💰'],['achv','成果库','🏆'],['applycal','申报日历','📅'],['users','权限矩阵','🔐'],['alerts','预警中心','🔔']],
};
const TITLES={
  dash:['工作台','个人科研驾驶舱'], academy:['启航学院','12 周科研入门路线图'],
  lib:['文献库','智能文献中枢'], replite:['复现体验','引导式 · 不会代码也能跑通'],

  mytask:['我的任务','来自课题组的任务'], mycal:['我的日程','课程 / 讲座 / 组会'],
  reimb:['我的报销','我的报销单'], profile:['成长档案','能力画像与里程碑'],

</div>`).join(''):'<div class="empty">暂无复现记录</div>'}
function RunGo(lite){
  const p=S.papers.find(x=>x.id===$('rp').value); if(!p){toast('请先添加文献');return}
  const steps=lite?['AI 讲解：这篇论文要解决什么','环境：云端已备好，无需安装','数据：自动下载并检查','代码：AI 逐块生成并讲解','运行：观察训练曲线','结果：读懂指标含义']
                  :['论文解析：抽取算法流程与评测指标','环境准备：PyTorch 2.3 + CUDA 12.1 容器','数据准备：下载并校验公开数据集','模型实现：AI 生成训练/评测代码','训练运行：默认超参 epoch=100','指标评估：与原文结果对比'];
  const run={id:Date.now(),paper:p.title,status:'运行中',steps,done:0,metrics:null};
  if(!lite){S.runs.unshift(run);save()}
  const con=$('con');con.innerHTML='<div class="cy">$ 任务已提交云端沙箱…</div>';
  const ul=$('steps');ul.innerHTML=steps.map(s=>`<li>${s}</li>`).join('');
  if(ul.children[0])ul.children[0].classList.add('doing');
  const lines=[[`$ nebulalab run --paper "${p.title.slice(0,30)}…"`,300],
    [`[解析] 方法核心：${p.tags.split(',')[0]} · 指标：Dice/AUC`,700],
    [`[环境] sandbox-gpu-7f3a 就绪 (T4×1)`,600],
    [`[数据] 下载 1.2GB · 校验通过 <span class="ok">✓</span>`,800],
    [`[代码] AI 生成 train.py (312 行)${lite?' · 每块已附讲解':''}`,800],
    [`[训练] epoch 100 · loss 0.031 · 收敛 <span class="ok">✓</span>`,1000]];
  let i=0,sn=0;
  const tick=()=>{if(i>=lines.length){if(!lite){run.status='已完成';run.metrics=[['指标','复现','原文','偏差'],['Dice','0.912','0.918','-0.6%'],['AUC','0.954','0.951','+0.3%']];save();$('runs').innerHTML=RunsHTML()}
      con.innerHTML+=`<div class="ok">✔ 复现完成（演示模拟）${lite?'，去「成长档案」看新点亮的技能！':'，报告已存入记录。'}</div>`;con.scrollTop=1e6;return}
    const[t,d]=lines[i++];con.innerHTML+=`<div>${t}</div>`;con.scrollTop=1e6;
    if(ul.children[sn]){ul.children[sn].classList.remove('doing');ul.children[sn].classList.add('done');sn++;if(ul.children[sn])ul.children[sn].classList.add('doing')}
    setTimeout(tick,d)};
  setTimeout(tick,400);toast(lite?'引导式复现已启动 🚀':'复现任务已提交沙箱 🧪');
}

function Suggest(){
  const un=S.tasks.filter(t=>t.assignee==='未分配');
  if(!un.length){$('tH').textContent='没有待分配任务';return}
  const msgs=[];
  un.forEach(t=>{
    const cand=S.members.map(m=>({m,l:TeamLoad(m.name),fit:(t.type==='实验'&&m.skills.includes('PyTorch'))||(t.type==='数据'&&m.skills.includes('数据'))||(t.type==='写作'&&m.skills.includes('写作'))||(t.type==='调研'&&m.skills.includes('影像'))?1:0}))
      .sort((a,b)=>(b.fit-a.fit)||(a.l-b.l))[0];
    const x=S.tasks.find(x=>x.id===t.id);x.assignee=cand.m.name;x.status='进行中';
    msgs.push(`「${t.name}」→ ${cand.m.name}（${cand.fit?'技能匹配✓':'负载最低'} ${cand.l}%）`);
  });
  save();go('team');
}

function MScore(m){const d=S.dirs.join('')+m.intent+m.skills+m.body;let s=42;

  if(m.verified==='已验证')s+=15;if(m.tpl)s-=25;if(m.body.length>90)s+=6;
  return Math.max(8,Math.min(96,s))}

V.cal=()=>{

  let cells=['日','一','二','三','四','五','六'].map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<first;i++)cells+='<div class="day dim"></div>';
  for(let d=1;d<=dim;d++){

    cells+=`<div class="day" ${isPi?`onclick="UI.ev('${ds}')"`:''}><span class="dn">${d}</span>${de.slice(0,3).map(e=>`<span class="ev ${e.type}" title="${esc(e.t)}">${esc(e.t.slice(0,9))}</span>`).join('')}</div>`;

/* ---- Claw ---- */
const Claw={inited:false,
  init(){this.inited=true;const c=$('chats');if(c&&c.dataset.f)return;c.dataset.f=1;
    $('chats').innerHTML=`<div class="msg a">🤖 <b>研擎 Claw</b> 已以「${ROLE_INFO[ROLE].label}」身份接入，只能回答<b>你权限内</b>的数据。试试下方问题。</div>`},
  send(){const v=$('ci').value.trim();if(!v)return;$('ci').value='';this.ask(v)},
  ask(q){
    if(!$('chats'))return;
    $('chats').insertAdjacentHTML('beforeend',`<div class="msg u">${esc(q)}</div>`);
    $('chats').insertAdjacentHTML('beforeend',`<div class="msg a" id="typing">Claw 正在检索${ROLE==='admin'?'全院聚合':'你权限内'}数据…</div>`);
    setTimeout(()=>{const el=$('typing');if(el)el.outerHTML=`<div class="msg a">${this.reply(q)}</div>`;$('chats').scrollTop=1e6},650);
    $('chats').scrollTop=1e6;
  },
  reply(q){
    q=q.toLowerCase();const me=ROLE_INFO[ROLE].name;
    if(ROLE==='ug'){
      if(q.includes('路线')||q.includes('开始')||q.includes('入门'))
        return `🗺️ 你的启航路线图：${S.roadmap.filter(r=>r.done).length}/${S.roadmap.length} 已完成。\n下一步：「${(S.roadmap.find(r=>!r.done)||{}).t||'全部完成，可进组深入'}」\n\n建议今天用 40 分钟到「复现体验」跑通引导式复现。`;
      if(q.includes('工具'))
        return `🧰 工具建议（按你的水平）：文献→Zotero；统计→JASP（零代码）；画图→研擎 Studio AI 生成初稿。\n完整对比见「启航学院 · 工具选型百科」。`;
      if(q.includes('任务'))
        return `✅ 你有 ${myTasks().filter(t=>t.status!=='已完成').length} 项进行中任务：\n${myTasks().map(t=>`· ${t.name}（${t.due} 截止）`).join('\n')||'暂无'}\n\n完成任务会自动写入成长档案，保研/申研时一键导出。`;
      return `我是你的科研教练 🎓，可以回答：\n· 我的路线图进展\n· 工具怎么选\n· 我的任务与日程\n\n（演示版为规则应答；正式版由大模型 + RAG 驱动）`;
    }
    if(ROLE==='grad'){
      if(q.includes('任务'))
        return `✅ 你的任务：\n${myTasks().map(t=>`· ${t.name}（${t.due}，${t.status}）`).join('\n')||'暂无'}\n\n💡 完成后导师工作台会实时同步。`;
      if(q.includes('投稿')||q.includes('审稿')||q.includes('大修'))
        return `🚀 你的投稿：${S.subs.filter(s=>s.owner===me).map(s=>`《${s.title.slice(0,14)}…》→ ${s.journal}（${s.status}）`).join('；')}\n\n⏰ MICCAI 大修 9/30 截止（还 ${days('2026-09-30')} 天），到「投稿中心」查看 AI 生成的逐条回复框架。`;
      if(q.includes('报销'))
        return `🧾 你的报销：${S.reimbs.filter(r=>r.owner===me).map(r=>`${r.title}（${r.st}）`).join('；')}\n\n流程：提交 → 导师审批 → 财务打款，状态实时同步。`;
      if(q.includes('文献')||q.includes('读'))
        return `📚 组内共享库 ${S.papers.length} 篇，已精读 ${S.papers.filter(p=>p.read).length} 篇。\n慧眼新检出 2 篇「联邦×多模态」高相关文献待精读；到文献库点「AI 精读」。`;
      return `我是你的科研搭档 🔬（权限：仅你自己的数据），可回答：\n· 我的任务 / 投稿 / 报销\n· 文献建议\n（注：组内他人负载与经费明细不在你的权限内）`;
    }
    if(ROLE==='pi'){
      if(q.includes('负载')||q.includes('忙')){
        const arr=S.members.map(m=>({m,l:TeamLoad(m.name)})).sort((a,b)=>b.l-a.l);
        return `📊 全组负载：\n${arr.map(a=>`${a.l>=75?'🔴':a.l>=45?'🟡':'🟢'} ${a.m.name}（${a.m.role}）— ${a.l}%`).join('\n')}\n\n💡 建议：${arr[0].m.name} 过载，可将「${(S.tasks.find(t=>t.assignee===arr[0].m.name&&t.status!=='已完成')||{}).name||'部分任务'}」转给 ${arr[arr.length-1].m.name}（${arr[arr.length-1].l}%）→ 调度中心一键执行。`;
      }
      if(q.includes('经费')||q.includes('报销'))
        return `💰 经费概况：\n${S.projects.map(p=>`· ${p.name}：${Math.round(p.spent/p.total*100)}%（结题 ${p.end}）`).join('\n')}\n🧾 待你审批的学生报销 ${S.reimbs.filter(r=>r.st==='待导师审批').length} 笔 → 经费管家。\n⚠ 省重点执行率偏低，Q4 优先安排 GPU 与差旅支出。`;
      if(q.includes('套磁')||q.includes('学生')||q.includes('招生'))
        {const b=[...S.mails].sort((x,y)=>MScore(y)-MScore(x))[0];
        return `📬 待处理 ${S.mails.filter(m=>m.status==='待处理').length} 封，优先看：\n· ${b.from}（${b.school}）匹配 ${MScore(b)} 分：技能契合+成果已核验 ✓\n· 已识别 1 封模板群发信并降权\n→ 套磁收件箱查看完整档案。`}
      if(q.includes('组会'))
        return `📋 本周组会议题（自动汇总）：\n1. 联邦框架 v2 进展（张伟，10/10 到期）\n2. 新文献速递：《Federated ... Survey》精读卡已生成\n3. 风险项：MICCAI 大修 9/30 截止（赵倩）\n\n议程草稿已生成，可到日程中心添加组会。`;
      return `我是你的课题组副驾 🧠（权限：全组数据），可回答：\n· 组内负载与调配\n· 经费与报销审批\n· 套磁匹配排名\n· 本周组会议题`;
    }
    /* admin */
    if(q.includes('经费')||q.includes('执行'))
      return `💰 全院执行率 ${S.insti.kpi.exec}%：\n${S.insti.depts.map(d=>`· ${d.name}：${d.rate}%${d.rate<40?' ⚠红线':''}`).join('\n')}\n\n已对 2 个红线学院生成督办函，签发后自动送达相关负责人。`;
    if(q.includes('项目')||q.includes('结题'))
      return `📑 在研 ${S.insti.kpi.projects} 项，其中 ${S.insti.kpi.pending} 项存在结题/执行风险：\n${S.iprojects.filter(p=>p.risk).map(p=>`· ${p.name}（${p.pi}，${p.risk}）`).join('\n')}\n\n→ 项目监管查看完整台账。`;
    if(q.includes('成果'))
      return `🏆 本年 SCI 一区 ${S.iachv.filter(a=>a.zone.includes('一区')).length} 篇（+20%），计算机学院领跑。\n学科评估口径数据已自动归集，可一键导出报表现状。`;
    return `我是机构治理助手 🏛（权限：全院聚合数据，不含个人明细），可回答：\n· 经费执行与红线\n· 项目与结题风险\n· 成果产出趋势`;
  }
};
V.claw=()=>`<div class="card chatwrap">
  <div class="chats" id="chats"></div>
  <div class="row" style="gap:8px;margin:10px 0">
    ${({ug:['我的路线图','工具怎么选','我的任务'],grad:['我的任务','投稿进展','我的报销'],pi:['组内谁负载最高','待批报销','本周组会议题'],admin:['经费执行率','结题风险','成果趋势']})[ROLE].map(q=>`<button class="chipq" onclick="Claw.ask('${q}')">${q}</button>`).join('')}

</div>`;

    <div class="row"><div class="fld" style="width:130px"><label>类型</label><select id="ntT"><option>实验</option><option>数据</option><option>写作</option><option>调研</option></select></div>

  exp(){UI.open(`<h3>＋ 登记支出</h3>
    <div class="fld"><label>项目</label><select id="neP">${S.projects.map(p=>`<option>${p.name}</option>`).join('')}</select></div>
    <div class="row"><div class="fld" style="flex:1"><label>科目</label><select id="neC"><option>数据采集费</option><option>测试化验加工费</option><option>劳务费</option><option>材料费</option><option>差旅费</option><option>设备费</option></select></div>
    <div class="fld" style="width:130px"><label>金额(万)</label><input id="neA" type="number" step="0.1"></div></div>
    <div class="fld"><label>说明</label><input id="neN"></div>
    <div class="acts"><button class="btn btn-o" onclick="closeM()">取消</button><button class="btn btn-p" onclick="UI.expOk()">登记</button></div>`)},
  expOk(){const a=+$('neA').value;if(!a){toast('请输入金额');return}
    const p=S.projects.find(p=>p.name===$('neP').value);
    if(p&&$('neC').value==='劳务费'&&(p.spent+a)/p.total>0.3){toast('⚠ 超出国自然劳务费红线 30%，已拦截');return}
    S.expenses.unshift({id:Date.now(),date:'2026-09-25',proj:p.name,cat:$('neC').value,note:$('neN').value||'—',amt:a,st:'已报销'});
    if(p)p.spent=Math.round((p.spent+a)*10)/10;

  ev(d){UI.open(`<h3>＋ 添加日程（导师）</h3>

    <div class="fld"><label>可见范围</label><select id="nvA"><option value="grp">组内全员</option><option value="pub">全校公开</option><option value="pi">仅导师</option></select></div>
