<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研擎 NebulaLab · 课题组科研操作系统</title>
<style>
:root{
  --blue:#1F419B; --deep:#16306F; --mid:#3E7BFA; --lblue:#8FB0F5;
  --ink:#20293E; --mut:#66708A; --faint:#98A1B6;
  --bg:#F4F7FC; --card:#FFFFFF; --line:#E0E6F0; --tint:#F3F6FC;
  --green:#0E7A55; --gold:#B08A2E; --red:#B42318; --violet:#6D5CF6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13.5px;background:#fff;border:1px solid #CBd5E8;color:var(--ink);border-radius:8px;padding:8px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--mid);box-shadow:0 0 0 3px rgba(62,123,250,.13)}
a{color:var(--mid)}
::selection{background:rgba(62,123,250,.25)}

/* ============ 登录页 ============ */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1.15fr}
@media(max-width:900px){.login{grid-template-columns:1fr}}
.lg-brand{background:radial-gradient(560px 380px at 18% 8%,rgba(62,123,250,.30),transparent 62%),linear-gradient(168deg,#16306F 0%,#1F419B 62%,#24499F 100%);color:#fff;padding:56px 52px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.lg-brand .logo{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800}
.lg-brand .logo .m{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:18px;font-weight:900}
.lg-brand h1{font-size:clamp(30px,3.6vw,44px);font-weight:900;line-height:1.35;margin:auto 0}
.lg-brand h1 em{font-style:normal;color:#AFC6FF}
.lg-brand p{color:#C9D5F2;font-size:14.5px;max-width:430px}
.lg-brand .kp{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}
.lg-brand .kp span{font-size:11.5px;padding:5px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.32);color:#DFE8FF}
.lg-brand .ft{font-size:12px;color:#8FA3D9;margin-top:26px}
.lg-panel{display:flex;flex-direction:column;justify-content:center;padding:48px 56px}
@media(max-width:600px){.lg-panel{padding:32px 22px}}
.lg-panel h2{font-size:23px;font-weight:800;color:var(--blue)}
.lg-panel .sub{color:var(--mut);margin:6px 0 26px;font-size:13.5px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.roles{grid-template-columns:1fr}}
.role{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:20px 18px;text-align:left;transition:.2s}
.role:hover{border-color:var(--mid);box-shadow:0 12px 30px rgba(22,48,111,.12);transform:translateY(-3px)}
.role .av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;margin-bottom:10px}
.role b{display:block;font-size:16px;color:var(--blue)}
.role .en{font-size:10px;letter-spacing:.2em;color:var(--faint);font-weight:700}
.role span{display:block;font-size:12px;color:var(--mut);margin-top:5px;line-height:1.5}
.role .go{float:right;color:var(--faint);font-weight:900}
.lg-tip{margin-top:22px;font-size:12px;color:var(--mut);background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:11px 15px}

/* ============ 应用框架 ============ */
.app{display:flex;min-height:100vh}
.side{width:228px;flex:none;background:linear-gradient(180deg,#16306F,#12295E);color:#C9D5F2;display:flex;flex-direction:column;padding:16px 11px;position:sticky;top:0;height:100vh}
.side .logo{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;color:#fff;font-weight:800;font-size:15.5px}
.side .logo .m{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#3E7BFA,#6D5CF6);display:grid;place-items:center;font-weight:900;color:#fff;font-size:14px}
.side .plane-lab{font-size:10px;letter-spacing:.28em;color:#7C8DBB;padding:8px 12px 4px;font-weight:700}
.nav-i{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#A9B7DC;font-size:13.5px;font-weight:500;width:100%;text-align:left;transition:.15s}
.nav-i:hover{color:#fff;background:rgba(255,255,255,.07)}
.nav-i.on{color:#fff;background:linear-gradient(90deg,rgba(62,123,250,.42),rgba(62,123,250,.14));box-shadow:inset 0 0 0 1px rgba(143,176,245,.25)}
.nav-i .ic{width:19px;text-align:center;flex:none}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
.who{display:flex;gap:10px;align-items:center;padding:0 10px 10px}
.who .av{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:15px}
.who b{display:block;color:#fff;font-size:13px}
.who span{font-size:10.5px;color:#8FA0C9}
.side-foot button{width:100%;padding:7px;border-radius:8px;color:#8FA0C9;font-size:12px}
.side-foot button:hover{background:rgba(255,255,255,.08);color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:12px;position:sticky;top:0;z-index:20}
.top h1{font-size:16.5px;font-weight:800;color:var(--deep)}
.top .crumb{font-size:11.5px;color:var(--faint)}
.conn-chips{margin-left:auto;display:flex;gap:6px;align-items:center}
.cchip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mut);background:var(--tint)}
.cchip.on{color:var(--green);border-color:#BFE3D4;background:#EEF9F4}
.gear{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;border:1px solid var(--line);color:var(--mut)}
.gear:hover{border-color:var(--mid);color:var(--mid)}
.view{padding:22px;max-width:1180px;width:100%;margin:0 auto}
.hide{display:none!important}
@media(max-width:760px){.side{width:60px}.side .logo span,.nav-i span.t,.who,.side-foot .t2,.plane-lab{display:none}.nav-i{justify-content:center}.view{padding:14px}}

/* 组件 */
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:9px;font-size:13.5px;font-weight:700;transition:.15s;border:1px solid transparent}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:var(--deep)}
.btn-m{background:var(--mid);color:#fff}
.btn-o{border-color:#C9D4EC;color:var(--blue);background:#fff}
.btn-o:hover{border-color:var(--mid)}
.btn-s{padding:5px 12px;font-size:12px;border-radius:7px}
.btn-g{border-color:#D6DEED;color:var(--mut);background:#fff}
h3.st{font-size:15px;font-weight:800;color:var(--deep);margin-bottom:13px;display:flex;align-items:center;gap:8px}
h3.st .n{font-size:11px;color:var(--faint);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;color:var(--mut);text-align:left;font-weight:700;padding:9px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #EEF1F8;vertical-align:middle}
tr:hover td{background:#FAFBFE}
.tag{display:inline-block;font-size:11px;padding:2.5px 10px;border-radius:999px;background:var(--tint);color:#2749A8;font-weight:700;border:1px solid #DCE4F5}
.tag.g{background:#EEF9F4;color:#0E7A55;border-color:#BFE3D4}
.tag.y{background:#FFF8E8;color:#8A6116;border-color:#EBD9A8}
.tag.r{background:#FDF0EE;color:#B42318;border-color:#F0C8C2}
.tag.v{background:#F3F0FE;color:#5546C8;border-color:#D9D0F8}
.tag.c{background:#EBF8FB;color:#0E7490;border-color:#C4E8F0}
.tag.m{background:#F3F4F6;color:#4B5563;border-color:#E2E5EA}
.bar{height:8px;border-radius:99px;background:#EDF0F7;overflow:hidden;min-width:56px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3E7BFA,#1F419B)}
.empty{padding:32px;text-align:center;color:var(--faint);font-size:13px;background:#FBFCFE;border:1px dashed #DCE3F0;border-radius:12px}
.mut{color:var(--mut)}.sm{font-size:12.5px}.xs{font-size:11.5px}
.kpi .v{font-size:26px;font-weight:900;color:var(--blue)}
.kpi .l{font-size:12.5px;color:var(--mut)}
.kpi .d{font-size:11.5px;font-weight:700}
.up{color:var(--green)}.dn{color:var(--red)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;border:1px solid;font-size:12.8px;margin-bottom:9px;background:#fff}
.alert.warn{border-color:#EBD9A8;background:#FFFBF2;color:#8A6116}
.alert.dan{border-color:#F0C8C2;background:#FFF7F6;color:#B42318}
.alert.info{border-color:#C4E0F7;background:#F7FAFF;color:#1e3a8a}
.alert b{flex:none}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:4px;font-weight:600}
.mask{position:fixed;inset:0;background:rgba(22,48,111,.42);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
.mask.open{display:flex}
.modal{width:min(580px,100%);background:#fff;border-radius:16px;padding:26px;max-height:86vh;overflow-y:auto;box-shadow:0 30px 80px rgba(22,48,111,.3)}
.modal h3{font-size:17px;color:var(--deep);margin-bottom:15px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:15px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--deep);color:#fff;font-size:13px;padding:11px 22px;border-radius:999px;transition:.3s;z-index:99;opacity:0;box-shadow:0 12px 30px rgba(22,48,111,.4)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ============ 流水线 ============ */
.pipe-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.pipe-prog{flex:1;min-width:220px}
.pipe-prog .tr{display:flex;align-items:center;gap:4px}
.pdot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:#fff;border:2px solid #C9D4EC;color:var(--faint);flex:none}
.pdot.done{background:var(--blue);border-color:var(--blue);color:#fff}
.pdot.cur{border-color:var(--mid);color:var(--blue);box-shadow:0 0 0 4px rgba(62,123,250,.15)}
.pbar{flex:1;height:4px;border-radius:4px;background:#E4E9F4;min-width:14px}
.pbar.done{background:var(--blue)}
.pipe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1000px){.pipe-grid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.pipe-grid{grid-template-columns:1fr}}
.pstep{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;position:relative}
.pstep.done{background:#FBFDFF;border-color:#C9DCF5}
.pstep.cur{border-color:var(--mid);box-shadow:0 10px 28px rgba(62,123,250,.14)}
.pstep.lock{opacity:.55}
.pstep .pn{font-size:10.5px;font-weight:800;letter-spacing:.2em;color:var(--mid)}
.pstep h4{font-size:15.5px;color:var(--deep);margin:2px 0 1px}
.pstep .pd{font-size:11.5px;color:var(--faint);margin-bottom:10px}
.pstep .qs{display:grid;gap:7px;margin-bottom:11px}
.pstep .q{display:grid;grid-template-columns:1fr;gap:3px}
.pstep .q label{font-size:11px;color:var(--mut);font-weight:600}
.pstep .q input,.pstep .q select{padding:6px 10px;font-size:12.5px}
.pstep .stat{position:absolute;top:14px;right:14px}
.art-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;background:#EEF9F4;color:#0E7A55;border:1px solid #BFE3D4}

/* 资产卡 */
.art{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 16px;position:relative}
.art .tp{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--mid)}
.art h5{font-size:14px;color:var(--deep);margin:2px 0 6px}
.art .bd{font-size:12.3px;color:var(--mut);line-height:1.6}
.art .bd table{font-size:11.5px}
.art .bd th{padding:5px 8px}
.art .bd td{padding:5px 8px}
.art .ev{margin-top:8px;font-size:11px;color:var(--faint);border-top:1px dashed var(--line);padding-top:7px}
.art .vis-sel{margin-top:9px;display:flex;align-items:center;gap:8px}
.art .vis-sel select{width:auto;padding:4px 10px;font-size:11.5px}
.art .sync{font-size:10.5px;color:var(--green);font-weight:700}

/* 组盘 Board */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}
@media(max-width:1100px){.board{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.board{grid-template-columns:1fr 1fr}}
.bcol{background:var(--tint);border:1px solid var(--line);border-radius:12px;padding:10px}
.bcol h5{font-size:12.5px;color:var(--deep);padding:2px 4px 8px;display:flex;justify-content:space-between}
.bcol h5 span{color:var(--faint);font-weight:600}
.bcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px;cursor:pointer;transition:.15s}
.bcard:hover{border-color:var(--mid);box-shadow:0 6px 16px rgba(22,48,111,.10)}
.bcard .r1{display:flex;align-items:center;gap:8px}
.bcard .av{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#16306F,#3E7BFA);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.bcard b{font-size:12.8px}
.bcard .role{font-size:10.5px;color:var(--faint)}
.bcard .r2{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.bcard .days{font-size:11px;color:var(--mut)}
.light{width:10px;height:10px;border-radius:50%;flex:none}
.light.g{background:#2FA47A;box-shadow:0 0 7px rgba(47,164,122,.7)}
.light.y{background:#E8A23C;box-shadow:0 0 7px rgba(232,162,60,.7)}
.light.r{background:#DC2626;box-shadow:0 0 8px rgba(220,38,38,.75);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}

/* 审计日志 */
.logline{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.logline .lt{flex:none;width:118px;color:var(--faint);font-size:11.5px}
.logline .la{flex:none;width:64px;font-weight:700;color:var(--blue)}
.logline .lx{color:var(--mut)}

/* chat */
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 132px);min-height:460px}
.chats{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px}
.msg{max-width:80%;padding:11px 15px;border-radius:14px;font-size:13.5px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--blue);color:#fff;border-radius:14px 14px 4px 14px}
.msg.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px}
.msg.a b{color:var(--deep)}
.msg .tool{margin-top:8px;font-size:11.5px;background:var(--tint);border:1px dashed #C9D4EC;border-radius:8px;padding:6px 10px;color:var(--mut)}
.chipq{font-size:12px;padding:6px 14px;border-radius:999px;border:1px solid #C4E0F7;color:#1e3a8a;background:#fff;font-weight:600}
.chipq:hover{background:var(--tint)}

/* 日历 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:11px;color:var(--faint);padding:5px 0;font-weight:700}
.day{min-height:70px;border:1px solid var(--line);border-radius:9px;padding:5px;font-size:11px;cursor:pointer;background:#fff}
.day:hover{border-color:var(--mid)}
.day.dim{opacity:.3;background:var(--tint)}
.day .dn{font-size:11.5px;color:var(--mut);font-weight:800}
.ev{display:block;border-radius:5px;padding:1.5px 6px;margin-top:3px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev.a{background:#E4EDFF;color:#1F419B}.ev.b{background:#E7F8F1;color:#0E7A55}
.ev.c{background:#FEF0EE;color:#B42318}.ev.d{background:#FFF4E0;color:#8A6116}
.ev.e{background:#F3F0FE;color:#5546C8}.ev.f{background:#F3F4F6;color:#374151}

/* 连接器开关 */
.swrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px dashed var(--line)}
.swrow:last-child{border-bottom:none}
.swrow b{font-size:13.5px;color:var(--deep)}
.swrow span{font-size:11.5px;color:var(--faint)}
.sw{margin-left:auto;width:42px;height:23px;border-radius:99px;background:#D5DCEA;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:2.5px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.sw.on{background:var(--mid)}
.sw.on::after{left:21px}

/* rebuttal */
.rb-item{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px;background:#fff}
.rb-item .qc{font-size:12.8px;color:#8A6116;background:#FFF8E8;border:1px solid #EBD9A8;border-radius:8px;padding:8px 11px;margin-bottom:8px}
.rb-item .draft{font-size:12.5px;color:var(--mut);background:var(--tint);border-radius:8px;padding:8px 11px;line-height:1.65}
.rb-item.ok{border-color:#BFE3D4;background:#FBFEFC}
.rb-item.ok .qc{opacity:.6}
</style>
</head>

<script>window.addEventListener('error',function(e){document.body.insertAdjacentHTML('beforeend','<pre id="jserr" style="color:#B42318">JSERR: '+e.message+' @'+e.lineno+'</pre>')});</script>

<!-- ================= 登录 ================= -->
<div id="login" class="login">
  <div class="lg-brand">
    <div class="logo"><div class="m">N</div>研擎 NebulaLab</div>
    <h1>AI 不长在对话框里，<br>而<em>长在任务上</em>。</h1>
    <p>课题组科研操作系统 —— 一个系统，三种身份，九步流水线。导师装了，学生必须装；一个课题组，一次部署。</p>
    <div class="kp"><span>学生平面 · 免费</span><span>导师平面 · 付费</span><span>机构平面 · 私有化</span></div>
    <div class="ft">数据仅保存在本地浏览器 · 演示环境 v3</div>
  </div>
  <div class="lg-panel">
    <h2>选择身份进入</h2>
    <div class="sub">三种平面 · 四个演示身份（RBAC 角色分权）</div>
    <div class="roles">
      <button class="role" onclick="enter('ug')"><div class="av" style="background:#EEF9F4">🎓</div><span class="go">→</span>
        <b>李小白</b><div class="en">STUDENT · 本科生</div>
        <span>启航流水线九步陪跑<br>从选题到第一篇论文</span></button>
      <button class="role" onclick="enter('grad')"><div class="av" style="background:#EBF3FF">🔬</div><span class="go">→</span>
        <b>陈博文</b><div class="en">STUDENT · 研究生</div>
        <span>流水线进行至第7步<br>正在处理 MICCAI 大修</span></button>
      <button class="role" onclick="enter('pi')"><div class="av" style="background:#FFF8E8">👨‍🏫</div><span class="go">→</span>

function Assign(id,name){const t=S.tasks.find(x=>x.id===id);t.assignee=name;if(name!=='未分配'){t.status='进行中';logA('王振华','任务分配',`「${t.name}」→ ${name}`)}save();go('matrix');toast(`已分配给 ${name}（其工作台已同步 · 已记录审计）`)}
function Suggest(){
  const un=S.tasks.filter(t=>t.assignee==='未分配');
  if(!un.length){$('tH').textContent='没有待分配任务';return}
  const msgs=[];
  un.forEach(t=>{
    const cand=S.members.map(m=>({m,l:TeamLoad(m.name),fit:(t.type==='实验'&&m.skills.includes('PyTorch'))||(t.type==='数据'&&m.skills.includes('数据'))||(t.type==='写作'&&m.skills.includes('写作'))||(t.type==='调研'&&m.skills.includes('影像'))?1:0}))
      .sort((a,b)=>(b.fit-a.fit)||(a.l-b.l))[0];
    const x=S.tasks.find(x=>x.id===t.id);x.assignee=cand.m.name;x.status='进行中';
    msgs.push(`「${t.name}」→ ${cand.m.name}（${cand.fit?'技能匹配✓':'负载最低'} ${cand.l}%）`);
  });
  logA('Claw·科研大脑','AI分工',msgs.join('；'));save();go('matrix');
}

    ['dan','⏰ 结题','「智慧交通感知」「跨中心AI诊断」进入 90 天倒计时'],
    ['warn','📊 偏低','生科学院 41%：建议冻结新增设备采购'],
    ['warn','📑 申报','NSFC 预审 10/25 截止，6 团队未提交'],
    ['info','🏆 利好','本年 SCI 一区 12 篇，同比 +20%']];
  const html=list.map(a=>`<div class="alert ${a[0]}"><b>${a[1]}</b><span>${a[2]}</span></div>`).join('');
  return inner?html:`<div class="card"><h3 class="st">🔔 预警中心</h3>${html}</div>`;
};

/* ---- Claw ---- */
const Claw={inited:false,
  init(){const c=$('chats');if(c&&c.dataset.f)return;c.dataset.f=1;
    $('chats').innerHTML=`<div class="msg a">🤖 <b>研擎 Claw</b> 已以「${ROLE_INFO[ROLE].label}」身份接入。我长在任务上：可以推进流水线、读组盘、查审计。试试：</div>`},
  send(){const v=$('ci').value.trim();if(!v)return;$('ci').value='';this.ask(v)},
  ask(q){if(!$('chats'))return;
    $('chats').insertAdjacentHTML('beforeend',`<div class="msg u">${esc(q)}</div>`);
    $('chats').insertAdjacentHTML('beforeend',`<div class="msg a" id="typing">Claw 检索权限内数据…</div>`);
    setTimeout(()=>{const el=$('typing');if(el)el.outerHTML=`<div class="msg a">${this.reply(q)}</div>`;$('chats').scrollTop=1e6},600);
    $('chats').scrollTop=1e6},
  tool(x){logA('Claw·'+x[0],'工具调用',x[1]);return `<div class="tool">🛠 已调用 ${x[0]}：${x[1]} · <b>已记录审计</b></div>`},
  reply(q){q=q.toLowerCase();const me=ROLE_INFO[ROLE].name;
    const NL2=String.fromCharCode(10);
    const R_STU=`我是长在任务上的 AI 🤖（权限：你自己的数据）。可问：流水线进展 / 大修怎么回 / 我的任务与工件`;
    const R_PI=`我是课题组副驾 🧠（权限：全组数据+审计）。可问：组盘谁卡住了 / 待批报销 / 最近审计 / 学生共享了什么`;
    const R_AD=`我是机构治理助手 🏛（权限：全院聚合，不含个人明细）。可问：经费执行与红线 / 结题风险 / 成果趋势`;
    if(ROLE==='ug'||ROLE==='grad'){
      const ps=S.pipeState[ROLE],dn=Object.keys(ps.done).length,nx=PIPE.find(p=>!ps.done[p.id]);
      if(q.includes('流水线')||q.includes('下一步')||q.includes('进展'))
        return `🚀 你的流水线：${dn}/9 步完成。${nx?('下一步是「'+nx.t+'」（第'+nx.id+'步），只需回答 3 个问题。'+NL2+NL2+'到「流水线」页点「生成'+nx.art+'」即可。'):''}`+this.tool(['科研大脑','读取流水线状态']);
      if(q.includes('大修')||q.includes('rebuttal')||q.includes('回复'))
        return `💬 MICCAI 大修还 ${days('2026-09-30')} 天截止。3 条意见已解析：2 条建议接受，1 条建议部分反驳。${NL2}${NL2}到「投稿中心」逐条采纳 AI 草稿。`+this.tool(['投稿顾问','解析审稿意见']);
      if(q.includes('资产')||q.includes('工件'))
        return `🗂 你有 ${S.artifacts.filter(a=>a.owner===me).length} 件工件。设为「对导师可见」的会进入组内资产库——是否共享由你决定（信任设计）。`;
      if(q.includes('任务'))
        return `✅ 进行中：${myTasks().filter(t=>t.status!=='已完成').map(t=>'· '+t.name+'（'+t.due+'）').join(NL2)||'无'}${NL2}${NL2}完成后导师端实时同步并记录审计。`;
      return R_STU;
    }
    if(ROLE==='pi'){
      const r=S.members.filter(m=>m.light==='r'),y=S.members.filter(m=>m.light==='y');
      if(q.includes('组盘')||q.includes('谁卡')||q.includes('红灯'))
        return `🚦 组盘：红灯 ${r.map(m=>m.name+'（'+m.stageName+' '+m.days+'天）').join('、')||'无'}；黄灯 ${y.map(m=>m.name).join('、')||'无'}。${NL2}${NL2}💡 建议：为 ${r[0]?r[0].name:'—'} 创建支援活动（工作台一键支援）。`+this.tool(['科研大脑','读取组盘信号']);
      if(q.includes('审计'))
        return `🧾 最近 3 条：${S.audit.slice(0,3).map(a=>'· '+a.t.slice(6)+' '+a.actor+' '+a.act).join(NL2)}${NL2}${NL2}所有 AI 调用不可删改——机构采购第一问。`;
      if(q.includes('报销')||q.includes('经费'))
        return `💰 全组执行率 ${Math.round((S.projects[0].spent+S.projects[1].spent)/(S.projects[0].total+S.projects[1].total)*100)}%，待你审批 ${S.reimbs.filter(x=>x.st==='待导师审批').length} 笔 → 经费管家。${NL2}⚠ 省重点执行率 33%，审计预警已生成。`+this.tool(['经费管家','汇总燃烧率']);
      if(q.includes('共享')||q.includes('工件')||q.includes('资产'))
        return `🗃 学生共享工件 ${S.artifacts.filter(a=>a.vis!=='me').length} 件；另有 ${S.artifacts.filter(a=>a.vis==='me').length} 件学生私有——信任设计：不显示明细。${NL2}${NL2}组内资产库可一键为张伟生成交接包。`;
      return R_PI;
    }
    if(q.includes('经费')||q.includes('执行'))
      return `💰 全院执行率 ${S.insti.kpi.exec}%：数学院 38%⚠红线、生科学院 41%。督办函已生成待签发。`+this.tool(['统计引擎','聚合全院数据']);
    if(q.includes('结题')||q.includes('项目'))
      return `📑 在研 ${S.insti.kpi.projects} 项，${S.insti.kpi.pending} 项存在结题/执行风险 → 项目监管查看台账。`;
    return R_AD;
  }
};
V.claw=()=>`<div class="card chatwrap">
  <div class="chats" id="chats"></div>
  <div class="row" style="gap:8px;margin:10px 0">
    ${({ug:['我的流水线进展','下一步做什么','我的任务'],grad:['流水线进展','大修怎么回','我的工件'],pi:['组盘谁卡住了','待批报销','最近审计'],admin:['经费执行率','结题风险','成果趋势']})[ROLE].map(q=>`<button class="chipq" onclick="Claw.ask('${q}')">${q}</button>`).join('')}
  </div>
  <div class="row" style="gap:10px"><input id="ci" placeholder="向 Claw 提问（基于你权限内的真实数据）…" onkeydown="if(event.key==='Enter')Claw.send()"><button class="btn btn-p" onclick="Claw.send()">发送</button></div>
</div>`;

/* ---- 弹窗 ---- */
const UI={
  open(h){$('modalBox').innerHTML=h;$('mask').classList.add('open')},
  conn(){const c=S.connectors;
    UI.open(`<h3>⚙ MCP 连接器层</h3>
    <div class="sm mut" style="margin-bottom:8px">红海环节集成别人的，无人区环节自建自己的；文档可同步出去，流程数据必须留在本库。</div>
    <div class="swrow"><div><b>Zotero</b><div class="xs">文献与引用同步（本地 API）</div></div><div class="sw ${c.zotero?'on':''}" onclick="togConn('zotero')"></div></div>
    <div class="swrow"><div><b>Notion</b><div class="xs">草稿与工件同步（官方 API）</div></div><div class="sw ${c.notion?'on':''}" onclick="togConn('notion')"></div></div>
    <div class="swrow"><div><b>GitHub</b><div class="xs">复现代码仓库</div></div><div class="sw ${c.github?'on':''}" onclick="togConn('github')"></div></div>
    <div class="swrow"><div><b>模型层</b><div class="xs">演示：云 API ｜ 机构版：本地 GLM/DeepSeek（数据不出校）</div></div>
      <select style="width:150px" onchange="S.connectors.model=this.value;logA(ROLE_INFO[ROLE].name,'连接器','模型切换为'+(this.value==='local'?'本地GLM':'云API'));save();renderConn();toast('模型已切换 ✓')">
        <option value="cloud" ${c.model==='cloud'?'selected':''}>云 API</option>
        <option value="local" ${c.model==='local'?'selected':''}>本地 GLM</option></select></div>
    <div class="acts"><button class="btn btn-o" onclick="closeM()">关闭</button></div>`)},
  exp(){UI.open(`<h3>＋ 登记支出</h3>
    <div class="fld"><label>项目</label><select id="neP">${S.projects.map(p=>`<option>${p.name}</option>`).join('')}</select></div>
    <div class="row"><div class="fld" style="flex:1"><label>科目</label><select id="neC"><option>数据采集费</option><option>测试化验加工费</option><option>劳务费</option><option>材料费</option><option>差旅费</option></select></div>
    <div class="fld" style="width:120px"><label>金额(万)</label><input id="neA" type="number" step="0.1"></div></div>
    <div class="fld"><label>说明</label><input id="neN"></div>
    <div class="acts"><button class="btn btn-o" onclick="closeM()">取消</button><button class="btn btn-p" onclick="UI.expOk()">登记</button></div>`)},
  expOk(){const a=+$('neA').value;if(!a){toast('请输入金额');return}
    const p=S.projects.find(p=>p.name===$('neP').value);
    if(p&&$('neC').value==='劳务费'&&(p.spent+a)/p.total>0.3){logA('王振华','红线拦截',`劳务费超30%红线：¥${a}万`);toast('⚠ 超出国自然劳务费红线 30%，已拦截并记录审计');return}
    S.expenses.unshift({id:Date.now(),date:'2026-09-25',proj:p.name,cat:$('neC').value,note:$('neN').value||'—',amt:a,st:'已报销'});
    p.spent=Math.round((p.spent+a)*10)/10;logA('王振华','支出登记',$('neC').value+' '+a+'万 · 规则校验通过');
    save();closeM();go('fund');toast('支出已登记 ✓')},
};
function togConn(k){S.connectors[k]=!S.connectors[k];logA(ROLE_INFO[ROLE].name,'连接器',(S.connectors[k]?'连接':'断开')+' '+k);save();renderConn();UI.conn();toast((S.connectors[k]?'已连接 ':'已断开 ')+k)}
function closeM(){$('mask').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});

/* ---- 启动 ---- */
const qp=new URLSearchParams(location.search).get('role');
const qv=new URLSearchParams(location.search).get('view');
if(qv){const _origGo=go;go=function(v){_origGo(v)}}
const saved=localStorage.getItem('nl_role');
if(qp&&ROLE_INFO[qp])enter(qp);
if(qv&&typeof go==='function'){try{go(qv)}catch(e){}}
else if(saved&&ROLE_INFO[saved])enter(saved);
else{S=load();save()}
</script>
</body>
